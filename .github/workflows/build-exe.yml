name: Build Windows Executable (.exe)

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub Actions
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '*.ipynb'

jobs:
  build-windows:
    name: Build Windows Exe
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Cài đặt thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔨 Đóng gói file .exe bằng PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "TaxTool" `
            --paths "." `
            --collect-all "pymupdf" `
            --hidden-import "openpyxl" `
            --hidden-import "pandas" `
            --hidden-import "pymupdf" `
            main.py

      - name: 🔍 Kiểm tra file kết quả
        run: |
          Get-Item -Path dist\TaxTool.exe

      - name: 🚀 Tải lên Artifact (.exe) để tải về
        uses: actions/upload-artifact@v4
        with:
          name: TaxTool-Windows-x64
          path: dist/TaxTool.exe
          retention-days: 30
